id = "sl"
name = "Silent"
version = "0.0.1"
schema_version = 1
authors = ["Yevhen Kapelianovych"]
description = "Silent language support: diagnostics, hover, and semantic tokens via the bundled LSP server"
repository = "https://github.com/Kapelianovych/language"

# Deliberately no [grammars.sl]: highlighting comes from the LSP's own
# semantic token rules, not a tree-sitter grammar.

[language_servers.sl-lsp]
name = "Silent Language Server"
language = "Silent"
